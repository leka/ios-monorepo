name: Linter - SwiftLint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.swift"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: swiftlint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          lfs: false

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.1.5
          install: true
          cache: true
          cache_key: "mise-{{platform}}-{{file_hash}}"

      - name: Run swiftlint
        run: |
          echo ""
          echo "🏃‍♂️ Running swiftlint on modified files 🤵‍♂️"
          swiftlint
          swiftlint --version
          git diff HEAD^1 HEAD --name-only --diff-filter=AMCR \
            | grep -E "\.swift\$$" \
            || echo "No files added nor modified!"
          git diff HEAD^1 HEAD --name-only --diff-filter=AMCR \
            | grep -E "\.swift\$$" \
            | xargs --no-run-if-empty swiftlint lint --quiet --reporter github-actions-logging
