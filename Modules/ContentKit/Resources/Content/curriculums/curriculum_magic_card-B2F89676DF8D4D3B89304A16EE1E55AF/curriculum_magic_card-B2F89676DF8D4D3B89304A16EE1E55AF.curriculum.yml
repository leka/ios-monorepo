  - locale: fr_FR
    details:
      icon: magic_card

      title: Activités Cartes Magiques
      subtitle: Pour changer de mode d'interaction

      abstract: |
        Un parcours autour des cartes magiques pour reconnaître des couleurs, des formes, des nombres, des aliments et des émotions.

      description: |
        Ce parcours propose une série d’activités interactives avec Leka et les cartes magiques.
        Le participant observe ce que Leka affiche (couleurs, formes, nombres, émotions, aliments)
        puis apporte la carte correspondante sur le front de Leka. Les activités renforcent la
        reconnaissance visuelle, le comptage et l’identification des émotions avec une interaction différente grâce aux cartes.

  - locale: en_US
    details:
      icon: magic_card

      title: Magic Card Activities
      subtitle: To change the interaction mode

      abstract: |
        A curriculum with magic cards to recognize colors, shapes, numbers, food, and emotions.

      description: |
        This curriculum offers a series of interactive activities with Leka and the magic cards.
        The participant observes what Leka displays (colors, shapes, numbers, emotions, food)
        and then places the corresponding card on Leka's forehead. The activities enhance
        visual recognition, counting, and emotion identification with a different interaction mode thanks to the cards.

