l10n:
  - locale: fr_FR
    details:
      icon: magic_card_flash_counting

      title: Cartes Magiques - Comptage les Flashs
      subtitle: Cartes 1 à 6

      short_description: |
        Compter les flashes lumineux et présenter la carte du bon nombre.

      description: |
        Leka clignote un certain nombre de fois. La personne accompagnée compte les flashes
        puis apporte la carte magique avec le nombre correspondant.

      instructions: |
        - Compter les flashes de Leka.
        - Apporter la carte du nombre correspondant sur le front de Leka.

  - locale: en_US
    details:
      icon: magic_card_flash_counting

      title: Magic Cards - Flash Counting
      subtitle: 1 to 6 Cards

      short_description: |
        Count the light flashes and present the card with the correct number.

      description: |
        Leka flashes a certain number of times. The care receiver counts the flashes
        then brings the magic card with the corresponding number.

      instructions: |
        - Count the flashes of Leka.
        - Bring the card with the corresponding number on Leka's forehead.

