l10n:
  - locale: fr_FR
    details:
      icon: magic_card_spot_counting

      title: Cartes magiques - Comptage des points
      subtitle: Cartes 1 à 6

      short_description: |
        Compter les points et choisir la carte magique correspondante.

      description: |
        Leka affiche des points lumineux autour de sa ceinture. Le participant compte les points
        puis apporte la carte magique avec le bon nombre.

      instructions: |
        - Compter les points affichés tout autour de la ceinture de Leka.
        - Apporter la carte du nombre correspondant sur le front de Leka.

  - locale: en_US
    details:
      icon: magic_card_spot_counting

      title: Magic Cards - Spot Counting
      subtitle: 1 to 6 Cards

      short_description: |
        Count the spots and choose the corresponding magic card.

      description: |
        Leka displays glowing spots around its belt. The participant counts the spots
        and then brings the magic card with the correct number.

      instructions: |
        - Count the spots displayed all around Leka's belt.
        - Bring the card with the corresponding number on Leka's forehead.
