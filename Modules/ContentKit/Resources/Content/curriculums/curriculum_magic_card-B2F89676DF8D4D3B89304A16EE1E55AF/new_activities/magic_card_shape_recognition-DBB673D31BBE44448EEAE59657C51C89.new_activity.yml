l10n:
  - locale: fr_FR
    details:
      icon: magic_card_shape_recognition

      title: Cartes magiques- Reconnaissance des formes
      subtitle: Cartes Triangle, Carré, Cercle, Étoile

      short_description: |
        Associer la forme affichée par Leka à la bonne carte magique.

      description: |
        Leka affiche une forme géométrique. Le participant doit identifier la forme et
        présenter la carte correspondante. L'activité renforce la reconnaissance et la
        discrimination des formes.

      instructions: |
        - Observer la forme affichée par Leka.
        - Apporter la carte de la même forme sur le front de Leka.


  - locale: en_US
    details:
      icon: magic_card_shape_recognition

      title: Magic Cards - Shape Recognition
      subtitle: Triangle, Square, Circle, Star Cards

      short_description: |
        Associate the shape displayed by Leka with the correct magic card.

      description: |
        Leka displays a geometric shape. The participant must identify the shape and
        present the corresponding card. The activity reinforces shape recognition and
        discrimination.

      instructions: |
        - Observe the shape displayed by Leka.
        - Bring the card with the same shape on Leka's forehead.

payload:
  options:
    shuffle_exercises: true
    shuffle_groups: false
  exercise_groups:
    - group:
        - instructions:
            - locale: fr_FR
              value: "Apporte la bonne carte sur le front de Leka"
            - locale: en_US
              value: "Bring the correct card on Leka's forehead"
          interface: magicCards
          gameplay: findTheRightAnswers
          action:
            type: robot
            value:
              type: image
              value: magicCardShapeTrianglePlainLine
          options:
            shuffle_choices: true
          payload:
