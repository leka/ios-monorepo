l10n:
  - locale: fr_FR
    details:
      icon: magic_card_number_recognition

      title: Cartes Magiques - Reconnaissance des Nombres
      subtitle: Cartes 1 à 6

      short_description: |
        Associer le nombre affiché par Leka à la bonne carte magique.

      description: |
        Leka affiche un nombre. La personne accompagnée doit identifier le nombre et
        présenter la carte correspondante. L'activité renforce la reconnaissance et le
        comptage des nombres.

      instructions: |
        - Observer le nombre affiché par Leka.
        - Apporter la carte correspondant à ce nombre sur le front de Leka.

  - locale: en_US
    details:
      icon: magic_card_number_recognition

      title: Magic Cards - Number Recognition
      subtitle: 1 to 6 Cards

      short_description: |
        Associate the number displayed by Leka with the correct magic card.

      description: |
        Leka displays a number. The participant must identify the number and
        present the corresponding card. The activity reinforces number recognition and counting.

      instructions: |
        - Observe the number displayed by Leka.
        - Bring the card corresponding to that number on Leka's forehead.

