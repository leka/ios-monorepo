l10n:
  - locale: fr_FR
    details:
      icon: magic_card_color_recognition_belt

      title: Cartes magiques - Reconnaissance des Couleurs (Ceinture)
      subtitle: Cartes Bleu, Rouge, Orange, Jaune, Vert

      short_description: |
        Identifier la couleur affichée par Leka et choisir la carte correspondante.

      description: |
        Cette activité consiste à reconnaître les couleurs affichées par Leka sur sa ceinture
        et à sélectionner la carte magique correspondante. Elle aide à développer la reconnaissance
        visuelle des couleurs.

      instructions: |
        - Regarder la couleur affichée sur la ceinture de Leka.
        - Apporter la carte de la même couleur sur le front de Leka.

  - locale: en_US
    details:
      icon: magic_card_color_recognition_belt

      title: Magic Cards - Belt Color Recognition
      subtitle: Blue, Red, Orange, Yellow, Green Cards

      short_description: |
        Identify the color displayed by Leka and choose the corresponding card.

      description: |
        This activity involves recognizing the colors displayed by Leka on its belt
        and selecting the corresponding magic card. It helps develop visual color recognition.

      instructions: |
        - Look at the color displayed on Leka's belt.
        - Bring the card with the same color on Leka's forehead.

payload:
  options:
    shuffle_exercises: true
    shuffle_groups: true
  exercise_groups:
    - group:
        - instructions:
            - locale: fr_FR
              value: "Apporte la bonne carte sur le front de Leka"
            - locale: en_US
              value: "Bring the correct card on Leka's forehead"
          interface: magicCards
          gameplay: findTheRightAnswers
          action:
            type: robot
            value:
              type: color
              value: blue
          options:
            shuffle_choices: true
