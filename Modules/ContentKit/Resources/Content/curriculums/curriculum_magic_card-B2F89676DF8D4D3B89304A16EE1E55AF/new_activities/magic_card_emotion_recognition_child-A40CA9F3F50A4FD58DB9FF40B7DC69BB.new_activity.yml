l10n:
  - locale: fr_FR
    details:
      icon: magic_card_emotion_recognition_child

      title: Cartes Magiques - Reconnaissance des Émotions d'Enfant
      subtitle: Cartes Émotions Enfant

      short_description: |
        Associer l'émotion affichée par Leka à la carte de l'enfant correspondante.

      description: |
        Leka affiche une expression émotionnelle. La personne accompagnée doit identifier l'émotion
        et apporter la carte magique représentant l'émotion d'un enfant. Cette activité
        favorise la reconnaissance des émotions.

      instructions: |
        - Observer l'expression affichée par Leka.
        - Apporter la carte correspondant à l'émotion sur le front de Leka.

  - locale: en_US
    details:
      icon: magic_card_emotion_recognition_child

      title: Magic Cards - Emotion Recognition Child
      subtitle: Child Emotion Cards

      short_description: |
        Match the emotion displayed by Leka to the corresponding child emotion card.

      description: |
        This activity involves recognizing the emotion displayed by Leka
        and selecting the corresponding child emotion card. It helps develop
        emotional recognition skills.

      instructions: |
        - Observe the expression displayed by Leka.
        - Bring the card corresponding to the emotion on Leka's forehead.

payload:
  options:
    shuffle_exercises: true
    shuffle_groups: false
  exercise_groups:
    - group:
        - instructions:
            - locale: fr_FR
              value: "Apporte la bonne carte sur le front de Leka"
            - locale: en_US
              value: "Bring the correct card on Leka's forehead"
          interface: magicCards
          gameplay: findTheRightAnswers
          action:
            type: robot
            value:
              type: image
              value: robotFaceSadWithTears
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: emotion_sadness_child
