l10n:
  - locale: fr_FR
    details:
      icon: magic_card_food_recognition

      title: Cartes Magiques - Reconnaissance des Aliments
      subtitle: Cartes Fruits et Légumes

      short_description: |
        Reconnaître les aliments affichés et choisir la carte magique correspondante.

      description: |
        Leka présente des fruits et des légumes. La personne accompagnée observe l'aliment affiché
        et apporte la carte magique associée. Cette activité développe la reconnaissance
        visuelle des aliments.

      instructions: |
        - Observer l'aliment affiché par Leka.
        - Apporter la carte magique correspondante sur le front de Leka.

  - locale: en_US
    details:
      icon: magic_card_food_recognition

      title: Magic Cards - Food Recognition
      subtitle: Fruits and Vegetables Cards

      short_description: |
        Recognize the displayed foods and choose the corresponding magic card.

      description: |
        Leka presents fruits and vegetables. The care receiver observes the displayed food
        and brings the corresponding magic card. This activity develops visual recognition
        of foods.

      instructions: |
        - Look at the food displayed by Leka.
        - Bring the corresponding magic card on Leka's forehead.

