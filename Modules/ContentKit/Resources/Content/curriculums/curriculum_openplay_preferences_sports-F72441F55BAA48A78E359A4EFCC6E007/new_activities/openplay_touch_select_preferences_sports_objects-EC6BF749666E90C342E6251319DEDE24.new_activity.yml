l10n:
  - locale: fr_FR
    details:
      icon: template_touch_to_select

      title: Choisir mes sports préférés
      subtitle: Objets

      short_description: |
        Pointer les sports que l'on aime pratiquer.

      description: |
        Cette activité aide le participant à exprimer ses envies parmi plusieurs sports familiers.

      instructions: |
        - Présentez chaque sport représenté par un objet ou un symbole.
        - Invitez le participant à toucher un ou plusieurs sports qu’il aimerait pratiquer.
        - Utilisez la sélection comme support d’échange ou de planification.

  - locale: en_US
    details:
      icon: template_touch_to_select

      title: Choose My Favorite Sports
      subtitle: Objects

      short_description: |
        Point to the sports you like to practice.

      description: |
        This activity helps the participant express wishes among several familiar sports.

      instructions: |
        - Present each sport represented by an object or symbol.
        - Invite the participant to tap one or more sports they would like to practice.
        - Use the selection to support discussion or planning.

