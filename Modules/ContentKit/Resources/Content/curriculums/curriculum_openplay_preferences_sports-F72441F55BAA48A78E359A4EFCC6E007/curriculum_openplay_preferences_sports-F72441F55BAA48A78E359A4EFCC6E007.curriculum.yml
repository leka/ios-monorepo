      title: Mes sports préférés
      subtitle: Activités libres

      abstract: |
        Un parcours pour aider le participant à exprimer ses préférences en matière d'activités sportives.

      description: |
        Ce parcours propose des activités sans bonne ou mauvaise réponse. Le participant peut toucher, trier ou ordonner des propositions pour partager ses goûts et ses envies.

        Les activités sont conçues comme supports d’échange avec l’accompagnant, qui valide les choix avec le participant et encourage la communication.

  - locale: en_US
    details:
      icon: emotion_recognition_pictograms

      title: My Sports Preferences
      subtitle: Open activities

      abstract: |
        A curriculum that helps the participant express preferences in sports activities.


      description: |
        This curriculum offers activities with no right or wrong answer. The participant can tap, sort, or order options to share tastes and wishes.

        The activities are designed as discussion supports with the caregiver, who validates the choices with the participant and encourages communication.

