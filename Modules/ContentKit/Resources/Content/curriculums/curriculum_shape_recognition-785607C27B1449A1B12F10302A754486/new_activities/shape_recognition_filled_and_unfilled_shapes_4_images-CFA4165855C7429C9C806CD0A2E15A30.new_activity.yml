l10n:
  - locale: fr_FR
    details:
      icon: shapes_filled_and_outlined_recognition

      title: Formes pleines et formes vides
      subtitle: 4 images

      short_description: |
        Regarde l'image de gauche. Touche la forme identique à droite.

      description: |
        Cette activité aide le participant à développer ses compétences en reconnaissance visuelle. Il s'agit d'identifier et de sélectionner la forme identique parmi plusieurs propositions. Cela permet de renforcer l'attention, la mémoire visuelle et la discrimination des formes.

      instructions: |
        - Encouragez le participant à observer attentivement la forme présentée à gauche.
        - Demandez-lui de trouver et de toucher la même forme parmi celles affichées à droite.
        - Lorsque la réponse est correcte, Leka initiera un renforçateur pour féliciter le participant.

  - locale: en_US
    details:
      icon: shapes_filled_and_outlined_recognition

      title: Filled and unfilled shapes
      subtitle: 4 images

      short_description: |
        Look at the image on the left. Touch the same shape on the right.

      description: |
        This activity helps the participant develop visual recognition skills. The task is to identify and select the matching shape from several options. It supports attention, visual memory, and shape discrimination.

      instructions: |
        - Encourage the participant to carefully observe the shape shown on the left.
        - Ask them to find and touch the same shape among those displayed on the right.
        - When the answer is correct, Leka will provide positive reinforcement to reward the participant.

