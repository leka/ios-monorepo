l10n:
  - locale: fr_FR
    details:
      icon: shapes_identical_colors_and_shapes_recognition

      title: Les formes et couleurs
      subtitle: 4 images

      short_description: |
        Regarde l'image de gauche. Touche la forme et la couleur identiques à droite.

      description: |
        Cette activité aide le participant à développer ses compétences en reconnaissance visuelle en combinant la forme et la couleur. Il s'agit d'identifier et de sélectionner l'objet ayant à la fois la même forme et la même couleur que celui affiché à gauche. Cela permet de renforcer l’attention visuelle, la mémoire et la discrimination des formes et des couleurs.

      instructions: |
        - Encouragez le participant à observer attentivement la forme et la couleur de l'objet présenté à gauche.
        - Demandez-lui de trouver et de toucher l’objet ayant exactement la même forme et la même couleur parmi ceux affichés à droite.
        - Lorsque la réponse est correcte, Leka initiera un renforçateur pour féliciter le participant.

  - locale: en_US
    details:
      icon: shapes_identical_colors_and_shapes_recognition

      title: Shapes and colors
      subtitle: 4 images

      short_description: |
        Look at the image on the left. Touch the shape and color that are the same on the right.

      description: |
        This activity helps the participant develop visual recognition skills by combining shape and color. The task is to identify and select the object that matches both the shape and the color of the one shown on the left. It supports visual attention, memory, and the discrimination of shapes and colors.

      instructions: |
        - Encourage the participant to carefully observe both the shape and color of the object shown on the left.
        - Ask them to find and touch the object on the right that has exactly the same shape and color.
        - When the answer is correct, Leka will provide positive reinforcement to reward the participant.

