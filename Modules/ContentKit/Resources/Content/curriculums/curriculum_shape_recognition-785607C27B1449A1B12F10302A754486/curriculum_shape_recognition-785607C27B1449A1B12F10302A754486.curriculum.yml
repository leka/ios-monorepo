  - locale: fr_FR
    details:
      icon: shape_recognition
      title: Les formes
      subtitle: Reconnaître formes, couleurs et contours
      abstract: |
        Ce parcours vise à développer la reconnaissance des formes, des couleurs, et des caractéristiques visuelles comme les contours ou le remplissage.
      description: |
        À travers des activités visuelles et interactives sur tablette, les participants sont amenés à identifier, associer ou différencier des formes selon divers critères : forme identique, couleur, remplissage ou contour. Ce parcours développe la discrimination visuelle, la mémoire et l’attention.

  - locale: en_US
    details:
      icon: shape_recognition
      title: Shapes
      subtitle: Recognize shapes, colors, and outlines
      abstract: |
        This curriculum aims to develop shape recognition, color matching, and visual features such as outline or fill.
      description: |
        Through visual and interactive activities on the tablet, participants are encouraged to identify, match, or differentiate shapes based on various criteria: identical shape, color, filled or outlined. This program supports visual discrimination, memory, and attention development.

