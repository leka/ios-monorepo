  - locale: fr_FR
    details:
      icon: openplay_touch_select_preferences_food_pictograms_vegetables

      title: Choisir mes légumes préférés
      subtitle: En pictogramme

      short_description: |
        Pointer les aliments que l'on aime.

      description: |
        Cette activité aide le participant à exprimer ses préférences parmi plusieurs aliments.

      instructions: |
        - Présentez chaque proposition visible à l'écran.
        - Invitez le participant à toucher une ou plusieurs propositions qu’il aime.
        - Utilisez la sélection comme support d’échange.

  - locale: en_US
    details:
      icon: openplay_touch_select_preferences_food_pictograms_vegetables

      title: Choose My Favorite Vegetables
      subtitle: Pictograms

      short_description: |
        Point to the foods you like.

      description: |
        This activity helps the participant express preferences among several foods.

      instructions: |
        - Present each option visible on screen.
        - Invite the participant to tap one or more options they like.
        - Use the selection to support discussion.

