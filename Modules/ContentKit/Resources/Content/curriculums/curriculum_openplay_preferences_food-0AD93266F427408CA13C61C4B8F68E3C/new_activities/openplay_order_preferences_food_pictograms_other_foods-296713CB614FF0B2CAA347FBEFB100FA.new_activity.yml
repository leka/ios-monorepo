l10n:
  - locale: fr_FR
    details:
      icon: template_drag_and_drop_in_order

      title: Classer mes aliments préférés
      subtitle: Pictogrammes - Autres aliments

      short_description: |
        Classer les aliments du préféré au moins préféré.

      description: |
        Cette activité aide le participant à exprimer ses préférences en ordonnant les propositions selon ses goûts.

      instructions: |
        - Présentez chaque proposition visible à l'écran.
        - Invitez le participant à placer en premier ce qu’il préfère, puis à continuer jusqu’à ce qu’il aime le moins.
        - Validez l’ordre avec le participant et utilisez-le comme support d’échange.

  - locale: en_US
    details:
      icon: template_drag_and_drop_in_order

      title: Rank My Favorite Foods
      subtitle: Pictograms - Other Foods

      short_description: |
        Rank the foods from favorite to least favorite.

      description: |
        This activity helps the participant express preferences by ordering options according to their tastes.

      instructions: |
        - Present each option visible on screen.
        - Invite the participant to place their favorite first, then continue to the one they like least.
        - Confirm the order with the participant and use it to support discussion.

