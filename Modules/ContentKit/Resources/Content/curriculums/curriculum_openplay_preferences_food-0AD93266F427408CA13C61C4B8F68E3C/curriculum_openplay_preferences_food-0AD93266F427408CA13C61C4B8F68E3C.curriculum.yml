  - locale: fr_FR
    details:
      icon: emotion_recognition_pictograms

      title: Mes aliments préférés
      subtitle: Activités libres

      abstract: |
        Un parcours pour aider le participant à exprimer ses goûts alimentaires.

      description: |
        Ce parcours propose des activités sans bonne ou mauvaise réponse. Le participant peut toucher ou classer des propositions par catégorie pour partager ses goûts, ses envies et ses ressentis.

        Les activités sont conçues comme supports d’échange avec l’accompagnant, qui valide les choix avec le participant et encourage la communication.

  - locale: en_US
    details:
      icon: emotion_recognition_pictograms

      title: My Favorite Foods
      subtitle: Open activities

      abstract: |
        A curriculum that helps the participant express food preferences.

      description: |
        This curriculum offers activities with no right or wrong answer. The participant can tap or rank categorized options to share tastes, wishes, and feelings.

        The activities are designed as discussion supports with the caregiver, who validates the choices with the participant and encourages communication.

