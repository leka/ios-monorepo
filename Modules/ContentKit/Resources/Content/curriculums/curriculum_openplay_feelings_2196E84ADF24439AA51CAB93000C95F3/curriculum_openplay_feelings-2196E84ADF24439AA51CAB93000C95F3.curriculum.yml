      title: Mes émotions
      subtitle: Activités libres

      abstract: |
        Un parcours libre pour aider le participant à exprimer son émotion actuelle, ou ses émotions dans un contexte donné.

      description: |
        Ce parcours propose des activités sans bonne ou mauvaise réponse. Le participant est invité à partager ses émotions.

        Les activités sont conçues comme supports d’échange avec l’accompagnant, qui valide les choix avec le participant et encourage la communication.

  - locale: en_US
    details:
      icon: emotion_recognition_pictograms

      title: My Feelings
      subtitle: Open activities

      abstract: |
        An OpenPlay curriculum that helps the participant express their current emotion or emotions in a given context.

      description: |
        This curriculum offers activities with no right or wrong answer. The participant is invited to share their feelings.

        The activities are designed as discussion supports with the caregiver, who validates the choices with the participant and encourages communication.

