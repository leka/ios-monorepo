l10n:
  - locale: fr_FR
    details:
      icon: template_touch_to_select

      title: Mes émotions dans un contexte
      subtitle: null

      short_description: |
        Sélectionner son ou ses émotions dans un contexte donné.

      description: |
        Cette activité pose un contexte et propose de sélectionner l'émotion que le participant ressentirait dans ce contexte.

      instructions: |
        - Identifiez le contexte présenté à l'écran.
        - Nommez les émotions visibles à l’écran.
        - Invitez le participant à toucher l’émotion ou les émotions qui correspondent le mieux à ce qu’il ressentirait dans ce contexte.
        - Accueillez la réponse sans jugement et proposez de la commenter si le participant le souhaite.

  - locale: en_US
    details:
      icon: template_touch_to_select

      title: My feelings in context
      subtitle: null

      short_description: |
        Select one or more feelings in a given context.

      description: |
        This activity presents a context and asks the participant to select the feeling they would experience in that context.

      instructions: |
        - Identify the context presented on the screen.
        - Name the feelings visible on the screen.
        - Invite the participant to tap the feeling or feelings that best match how they would feel in this context.
        - Accept the answer without judgment and offer to discuss it if the participant wants.

