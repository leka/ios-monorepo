l10n:
  - locale: fr_FR
    details:
      icon: template_touch_to_select

      title: Dire comment je me sens
      subtitle: Dessins

      short_description: |
        Sélectionner son ou ses émotions du moment.

      description: |
        Cette activité soutient l’expression émotionnelle en proposant plusieurs émotions. La personne peut ainsi identifier et partager ce qu’elle ressent.

      instructions: |
        - Nommez les émotions visibles à l’écran.
        - Invitez le participant à toucher l’émotion ou les émotions qui correspondent le mieux à son ressenti.
        - Accueillez la réponse sans jugement et proposez de la commenter si le participant le souhaite.

  - locale: en_US
    details:
      icon: template_touch_to_select

      title: Share How I Feel
      subtitle: Drawings

      short_description: |
        Select one or more current feelings.

      description: |
        This activity supports emotional expression by offering several feelings. The participant can identify and share what they are feeling.

      instructions: |
        - Name the feelings visible on the screen.
        - Invite the participant to tap the feeling or feelings that best match how they feel.
        - Accept the answer without judgment and offer to discuss it if the participant wants.

payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false

  exercise_groups:
    - group:
        - instructions:
            - locale: fr_FR
              value: Touche le ou les émotions qui ressemblent à ce que tu ressens
            - locale: en_US
              value: Tap the feeling or feelings that match how you feel
          interface: touchToSelect
          gameplay: openPlay
          options:
            shuffle_choices: true
          payload:
