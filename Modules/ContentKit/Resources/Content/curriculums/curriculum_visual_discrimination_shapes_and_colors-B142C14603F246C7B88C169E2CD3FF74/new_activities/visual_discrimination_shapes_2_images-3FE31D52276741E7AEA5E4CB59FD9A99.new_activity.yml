l10n:
  - locale: fr_FR
    details:
      icon: shapes_identical_shapes_recognition

      title: Reconnaître la forme en faisant abstraction de sa couleur
      subtitle: 2 images

      short_description: |
        Regarde l'image de gauche. Touche la forme identique à droite, peu importe la couleur.

      description: |
        Cette activité aide le participant à développer ses compétences en reconnaissance visuelle en se concentrant uniquement sur la forme. Il s'agit d’identifier et de sélectionner l’objet ayant la même forme que celui affiché à gauche, indépendamment de sa couleur. Cela permet de renforcer la discrimination visuelle, l’attention et la reconnaissance des formes.

      instructions: |
        - Encouragez le participant à observer attentivement la forme de l'objet présenté à gauche, sans se soucier de sa couleur.
        - Demandez-lui de trouver et de toucher l’objet ayant exactement la même forme parmi ceux affichés à droite, même si la couleur est différente.
        - Lorsque la réponse est correcte, Leka initiera un renforçateur pour féliciter le participant.

  - locale: en_US
    details:
      icon: shapes_identical_shapes_recognition

      title: Recognize the shape while ignoring its color
      subtitle: 2 images

      short_description: |
        Look at the image on the left. Touch the same shape on the right, regardless of color.

      description: |
        This activity helps the participant develop visual recognition skills by focusing only on shape. The task is to identify and select the object that has the same shape as the one shown on the left, regardless of its color. This supports visual discrimination, attention, and shape recognition.

      instructions: |
        - Encourage the participant to carefully observe the shape of the object on the left, without focusing on its color.
        - Ask them to find and touch the object on the right that has exactly the same shape, even if the color is different.
        - When the answer is correct, Leka will provide positive reinforcement to reward the participant.

