l10n:
  - locale: fr_FR
    details:
      icon: shapes_identical_colors_recognition

      title: Reconnaître la couleur en faisant abstraction de la forme
      subtitle: 4 images

      short_description: |
        Regarde l'image de gauche. Touche la couleur identique à droite, peu importe la forme.

      description: |
        Cette activité aide le participant à développer ses compétences en reconnaissance visuelle en se concentrant uniquement sur la couleur. Il s'agit d’identifier et de sélectionner l’objet ayant la même couleur que celui affiché à gauche, indépendamment de sa forme. Cela permet de renforcer la discrimination visuelle et l’attention portée aux caractéristiques pertinentes.

      instructions: |
        - Encouragez le participant à observer attentivement la couleur de l'objet présenté à gauche, sans se soucier de sa forme.
        - Demandez-lui de trouver et de toucher l’objet ayant exactement la même couleur parmi ceux affichés à droite, même si la forme est différente.
        - Lorsque la réponse est correcte, Leka initiera un renforçateur pour féliciter le participant.

  - locale: en_US
    details:
      icon: shapes_identical_colors_recognition

      title: Recognize the color while ignoring the shape
      subtitle: 4 images

      short_description: |
        Look at the image on the left. Touch the same color on the right, regardless of shape.

      description: |
        This activity helps the participant develop visual recognition skills by focusing only on color. The task is to identify and select the object that has the same color as the one shown on the left, regardless of its shape. This supports visual discrimination and attention to relevant features.

      instructions: |
        - Encourage the participant to carefully observe the color of the object on the left, without focusing on its shape.
        - Ask them to find and touch the object on the right that has exactly the same color, even if the shape is different.
        - When the answer is correct, Leka will provide positive reinforcement to reward the participant.

