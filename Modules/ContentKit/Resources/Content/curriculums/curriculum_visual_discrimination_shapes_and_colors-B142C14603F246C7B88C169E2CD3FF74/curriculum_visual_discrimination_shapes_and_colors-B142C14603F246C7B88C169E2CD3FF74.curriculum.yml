l10n:
  - locale: fr_FR
    details:
      icon: shapes_identical_shapes_recognition
      title: Discrimination visuelle
      subtitle: Identifier la forme ou la couleur sans se laisser distraire par l’autre
      abstract: |
        Ce parcours aide à développer la capacité à se concentrer sur un seul critère visuel à la fois : la forme ou la couleur.
      description: |
        À travers quatre activités interactives sur tablette, le participant apprend à reconnaître soit la couleur, soit la forme d’un objet, sans se laisser distraire par d’autres éléments visuels.
        L’objectif est de renforcer l’attention sélective et la capacité à filtrer les informations pertinentes dans un environnement visuel complexe.
        Ces compétences sont essentielles pour de nombreuses tâches du quotidien, comme la lecture, le tri ou la reconnaissance d’objets.

  - locale: en_US
    details:
      icon: shapes_identical_shapes_recognition
      title: Visual Discrimination
      subtitle: Identify shape or color without being distracted by the other
      abstract: |
        This curriculum helps develop the ability to focus on one visual feature at a time: shape or color.
      description: |
        Across four interactive tablet-based activities, the participant learns to recognize either the color or the shape of an object while ignoring other visual information.
        The goal is to strengthen selective attention and the ability to filter relevant details in visually complex environments.
        These skills are essential for everyday tasks such as reading, sorting, and object recognition.

