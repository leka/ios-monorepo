  - locale: fr_FR
    details:
      icon: curriculum_memory_house_old_objects
      title: Memory des objets de la maison
      subtitle: Travailler la mémoire et l'attention
      abstract: |
        Ce parcours est conçu pour améliorer la mémoire à court terme et l'attention à travers des jeux de mémoire avec des images d'objets. Il commence par des paires simples et augmente progressivement en difficulté.
      description: |
        Le parcours "Memory des objets de la maison" est une série d'activités conçues pour aider les participants à améliorer leur mémoire et leur attention. Chaque activité présente des images d'objets que les joueurs doivent associer en paires. Les niveaux de difficulté augmentent progressivement, commençant par une seule paire et allant jusqu'à quatre paires, pour offrir un défi croissant et maintenir l'engagement.

  - locale: en_US
    details:
      icon: curriculum_memory_house_old_objects
      title: Houseold items Memory
      subtitle: Improving memory and attention
      abstract: |
        This curriculum is designed to improve short-term memory and attention through memory games featuring objects images. It starts with simple pairs and gradually increases in difficulty.
      description: |
        The "Houseold items Memory" curriculum is a series of activities aimed at helping participants improve their memory and attention. Each activity features fruits images that players must match in pairs. The levels of difficulty gradually increase, starting with a single pair and progressing to four pairs, providing a growing challenge to keep participants engaged.

