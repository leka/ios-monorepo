l10n:
  - locale: fr_FR
    details:
      icon: curriculum_memory_house_old_objects

      title: Memory des objets de la maison
      subtitle: 1 paire

      short_description: |
        Un jeu de mémoire engageant avec des images d'objets. Trouvez les paires correspondantes pour gagner.

      description: |
        Le Memory des objets de la maison est conçu pour améliorer la mémoire à court terme et l'attention. Ce jeu présente des images d'objets que les joueurs doivent associer en paires. C'est un excellent moyen de développer des compétences cognitives tout en s'amusant.

      instructions: |
        - Appuyez sur une carte pour la retourner.
        - Trouvez la carte correspondante pour former une paire.
        - Continuez jusqu'à ce que toutes les paires soient trouvées.

  - locale: en_US
    details:
      icon: curriculum_memory_house_old_objects

      title: Houseold items Memory
      subtitle: 1 pair

      short_description: |
        An engaging memory game featuring home objects images. Find the matching pairs to win.

      description: |
        Houseold items Memory is designed to improve short-term memory and attention. This game features objects images that players must match in pairs. It’s a great way to develop cognitive skills while having fun.

      instructions: |
        - Tap a card to flip it.
        - Find the matching card to form a pair.
        - Continue until all pairs are found.

