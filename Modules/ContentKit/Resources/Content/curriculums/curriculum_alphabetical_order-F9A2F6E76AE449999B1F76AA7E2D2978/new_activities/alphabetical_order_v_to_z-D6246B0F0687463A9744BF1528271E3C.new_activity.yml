l10n:
  - locale: fr_FR
    details:
      icon: order_the_alphabet_letters_v_to_z

      title: Ordonner les lettres from V to Z
      subtitle: 6 lettres

      short_description: |
        Glisser et déposer les lettres from V to Z dans le bon ordre alphabétique

      description: |
        Le participant doit glisser et déposer les cinq lettres from V to Z pour les remettre dans l'ordre alphabétique.

      instructions: |
        - Sur l'écran de l'iPad, les lettres from V to Z sont présentées dans un ordre aléatoire.
        - Chaque lettre est affichée sous forme d'image ou de caractère.
        - Encouragez le participant à glisser chaque lettre dans la bonne position pour reformer l'ordre alphabétique de A à F.
        - Une fois les lettres correctement ordonnées, Leka déclenche un renforçateur pour célébrer la réussite et encourager l'apprentissage.

  - locale: en_US
    details:
      icon: order_the_alphabet_letters_v_to_z

      title: Order the letters from V to Z
      subtitle: 6 letters

      short_description: |
        Drag and drop the letters from V to Z into the correct alphabetical order

      description: |
        The participant must drag and drop the five letters from V to Z into alphabetical order.

      instructions: |
        - On the iPad screen, the letters from V to Z are shown in a random order.
        - Each letter is displayed as an image or character.
        - Encourage the participant to drag each letter to the correct position to form the alphabetical sequence from A to F.
        - Once the letters are correctly ordered, Leka triggers a reinforcer to celebrate the success and encourage learning.

