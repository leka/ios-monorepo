l10n:
  - locale: en_US
    details:
      icon: leka_weather_robot

      title: Weather with Leka
      subtitle: 6 images

      short_description: |
        A fun activity where the person accompanied associates objects with the
        weather displayed by Leka by touching the correct images on the iPad.

      description: |
        Leka displays a weather forecast on its screen (sun, snow, night, hot or cold). The person accompanied must observe and touch the objects corresponding to this weather on the iPad.

      instructions: |
        - Encourage the person accompanied to look at the Leka screen.
        - Ask him to observe the weather displayed.
        - Invite him to touch the corresponding objects on the iPad.

  - locale: fr_FR
    details:
      icon: leka_weather_robot
      title: La météo avec Leka
      subtitle: 6 images
      short_description: |
        Une activité ludique où la personne accompagnée associe des objets à la
        météo affichée par Leka en touchant les bonnes images sur l’iPad.

      description: |
        Leka affiche une météo sur son écran (soleil, neige, nuit, chaud ou froid). La personne accompagnée doit observer et toucher sur l’iPad les objets correspondant à cette météo.

      instructions: |
        - Incitez la personne accompagnée à regarder l’écran de Leka.
        - Demandez-lui d’observer la météo affichée.
        - Invitez-la à toucher les objets correspondants sur l’iPad.

