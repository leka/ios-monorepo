l10n:
  - locale: fr_FR
    details:
      icon: recognition_emotions_robot_generalization_6

      title: Les émotions du robot
      subtitle: Généralisation - 6 images

      short_description: |
        Apprenez à reconnaître les émotions grâce au robot Leka.

      description: |
        Le robot Leka vous propose une activité amusante et éducative pour identifier différentes émotions. Suivez les instructions et touchez l'émotion affichée par le robot.

      instructions: |
        Regardez l'expression du robot, puis touchez l'image correspondant à l'émotion qu'il montre. C'est une excellente façon de s'entraîner à reconnaître les émotions.

  - locale: en_US
    details:
      icon: recognition_emotions_robot_generalization_6

      title: The Emotions of the Robot
      subtitle: Generalization - 6 images

      short_description: |
        Learn to recognize emotions with the Leka robot.

      description: |
        The Leka robot offers a fun and educational activity to identify various emotions. Follow the instructions and tap the emotion displayed by the robot.

      instructions: |
        Observe the robot's expression, then tap the image corresponding to the emotion it is showing. It's a great way to practice recognizing emotions.

