l10n:
  - locale: fr_FR
    details:
      icon: counting_with_leka_musical_instruments

      title: Compter avec Leka
      subtitle: Instruments de musique

      short_description: |
        Une activité ludique pour apprendre à compter avec le robot Leka.

      description: |
        Cette activité aide la personne accompagnée à développer ses compétences en comptage. Le robot affiche un chiffre sur son écran, et la personne accompagnée doit toucher exactement ce nombre d’éléments sur la tablette.

        Tous les éléments affichés sont des réponses possibles : seule la quantité sélectionnée compte. L’objectif est de sélectionner ni moins ni plus que le nombre demandé, en comptant chaque élément touché.

      instructions: |
        - Demandez à la personne accompagnée d’observer le chiffre affiché par le robot.
        - Expliquez qu’elle doit toucher exactement ce nombre d’éléments sur la tablette, ni plus ni moins.
        - Rappelez-lui que tous les éléments affichés peuvent être choisis.
        - Encouragez-la à compter à voix haute en touchant chaque élément.

  - locale: en_US
    details:
      icon: counting_with_leka_musical_instruments

      title: Counting with Leka
      subtitle: Musical instruments

      short_description: |
        A fun activity to learn counting with the Leka robot.

      description: |
        This activity helps the care receiver develop counting skills. The robot displays a number on its screen, and the care receiver must tap exactly that many items on the tablet.

        All displayed items are valid choices: only the selected quantity matters. The goal is to select no fewer and no more than the requested number while counting each tapped item.

      instructions: |
        - Ask the care receiver to observe the number displayed by the robot.
        - Explain that they need to tap exactly that many items on the tablet, no more and no fewer.
        - Remind them that all displayed items can be chosen.
        - Encourage them to count out loud while tapping each item.

