l10n:
  - locale: fr_FR
    details:
      icon: recognition_parts_of_the_face

      title: Les parties du visage
      subtitle: 1 image

      short_description: |
        Touche la partie du visage demandée

      description: |
        Le participant doit répondre correctement à la question posée concernant les parties du visage.

      instructions: |
        - Appuyez sur le haut-parleur pour jouer la consigne
        - Encouragez le participant à toucher l'image demandée
        - Quand la réponse est correcte, Leka lance un renforçateur

  - locale: en_US
    details:
      icon: recognition_parts_of_the_face

      title: Face Parts
      subtitle: 1 image

      short_description: |
        Touch the requested face part

      description: |
        The participant must correctly answer the question about the face parts.

      instructions: |
        - Press the speaker to play the instruction
        - Encourage the participant to touch the requested image
        - When the answer is correct, Leka will initiate a reinforcer

exercises_payload:
  options:
    shuffle_exercises: true
    shuffle_groups: false

  exercise_groups:
    - group:
        - instructions:
            - locale: fr_FR
              value: Ecoute et touche la partie du visage demandée
            - locale: en_US
              value: Listen and touch the requested face part
          interface: listenThenTouchToSelect
          gameplay: findTheRightAnswers
          action:
            type: ipad
            value:
              type: speech
              value:
                - locale: fr_FR
                  utterance: "la joue"
                - locale: en_US
                  utterance: "the cheek"
          payload:
            shuffle_choices: true
            choices:
              - value: parts_of_the_face_cheek
