      title: Les parties du corps et du visage
      subtitle: Reconnaître les parties du corps et du visage
      abstract: |
        Ce parcours aide les participants à reconnaître et nommer les différentes parties du corps et du visage.
      description: |
        Le parcours est conçu pour aider les participants à apprendre les parties du corps et du visage par le biais d'exercices interactifs. Les participants devront écouter les consignes et toucher les images correspondantes pour identifier correctement les différentes parties du corps et du visage.

