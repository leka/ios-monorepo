      abstract: |
        This course helps participants recognize and name the different parts of the body and face.
      description: |
        The course is designed to help participants learn the parts of the body and face through interactive exercises. Participants will need to listen to the instructions and touch the corresponding images to correctly identify the different parts of the body and face.

