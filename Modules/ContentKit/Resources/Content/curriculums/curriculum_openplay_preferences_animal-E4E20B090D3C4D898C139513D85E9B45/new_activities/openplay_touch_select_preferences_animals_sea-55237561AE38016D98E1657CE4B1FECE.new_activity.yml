l10n:
  - locale: fr_FR
    details:
      icon: openplay_touch_select_preferences_animals_sea

      title: Choisir mes animaux préférés
      subtitle: Mer

      short_description: |
        Pointer les animaux que l'on aime.

      description: |
        Cette activité aide le participant à exprimer ses préférences parmi plusieurs animaux.

      instructions: |
        - Présentez chaque proposition visible à l'écran.
        - Invitez le participant à toucher une ou plusieurs propositions qu’il aime.
        - Utilisez la sélection comme support d’échange.

  - locale: en_US
    details:
      icon: openplay_touch_select_preferences_animals_sea

      title: Choose My Favorite Animals
      subtitle: Sea

      short_description: |
        Point to the animals you like.

      description: |
        This activity helps the participant express preferences among several animals.

      instructions: |
        - Present each option visible on screen.
        - Invite the participant to tap one or more options they like.
        - Use the selection to support discussion.

