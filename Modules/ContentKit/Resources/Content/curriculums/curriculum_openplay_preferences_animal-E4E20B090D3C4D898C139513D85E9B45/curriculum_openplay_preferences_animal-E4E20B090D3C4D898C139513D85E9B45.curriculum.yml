  - locale: fr_FR
    details:
      icon: curriculum_openplay_preferences_animal

      title: Mes animaux préférés
      subtitle: Activités libres

      abstract: |
        Un parcours pour aider le participant à exprimer ses préférences parmi différents animaux.

      description: |
        Ce parcours propose des activités sans bonne ou mauvaise réponse. Le participant peut toucher ou classer des animaux par catégorie pour partager ses goûts et ses envies.

        Les activités sont conçues comme supports d’échange avec l’accompagnant, qui valide les choix avec le participant et encourage la communication.

  - locale: en_US
    details:
      icon: curriculum_openplay_preferences_animal

      title: My Favorite Animals
      subtitle: Open activities

      abstract: |
        A curriculum that helps the participant express preferences among different animals.

      description: |
        This curriculum offers activities with no right or wrong answer. The participant can tap or rank animals by category to share tastes and wishes.

        The activities are designed as discussion supports with the caregiver, who validates the choices with the participant and encourages communication.

