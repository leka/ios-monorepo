payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false

  exercise_groups:
    - group:
        - instructions:
            - locale: fr_FR
              value: Touche la couleur de Leka
            - locale: en_US
              value: Touch the color of Leka
          interface: touchToSelect
          gameplay: findTheRightAnswers
          action:
            type: robot
            value:
              type: color
              value: green
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: green
                type: color
                is_right_answer: true
              - value: purple
                type: color

        - instructions:
            - locale: fr_FR
              value: Touch le rond jaune
            - locale: en_US
              value: Touch the yellow circle
          interface: touchToSelect
          gameplay: findTheRightAnswers
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: yellow
                type: color
                is_right_answer: true
              - value: red
                type: color
              - value: green
                type: color
              - value: blue
                type: color

    - group:
        - instructions:
            - locale: fr_FR
              value: Touch la pastèque
            - locale: en_US
              value: Touch the watermelon
          interface: touchToSelect
          gameplay: findTheRightAnswers
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: 🍉
                type: emoji
                is_right_answer: true
              - value: 🍌
                type: emoji
              - value: 🍒
                type: emoji
              - value: 🥝
                type: emoji

        - instructions:
            - locale: fr_FR
              value: Touch le carré
            - locale: en_US
              value: Touch the square
          interface: touchToSelect
          gameplay: findTheRightAnswers
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: circle
                type: sfsymbol
              - value: square
                type: sfsymbol
                is_right_answer: true
              - value: triangle
                type: sfsymbol
              - value: rhombus
                type: sfsymbol
