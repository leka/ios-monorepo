payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false
  exercise_groups:
    - group:
        - instructions:
          - locale: fr_FR
            value: "Place le symbol dans la case en dessous"
          - locale: en_US
            value: "Put the symbol in the case below"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: airplane
                type: sfsymbol
        - instructions:
          - locale: fr_FR
            value: "Écoute le type d'ordre et classe ces chiffres selon lui"
          - locale: en_US
            value: "Listen the order and sort in the correct order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          action:
            type: ipad
            value:
              type: speech
              value:
                - locale: fr_FR
                  utterance: "Croissant"
                - locale: en_US
                  utterance: "Ascending"
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: 1.circle.fill
                type: sfsymbol
              - value: 2.circle.fill
                type: sfsymbol
              - value: 3.circle.fill
                type: sfsymbol
              - value: 4.circle.fill
                type: sfsymbol
              - value: 5.circle.fill
                type: sfsymbol
              - value: 6.circle.fill
                type: sfsymbol
        - instructions:
          - locale: fr_FR
            value: "Trie du moins polluant au plus polluant"
          - locale: en_US
            value: "Sort from the least polluting to the worst"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: scooter
                type: sfsymbol
                state: hint
              - value: bicycle
                type: sfsymbol
                state: hint
              - value: sailboat.fill
                type: sfsymbol
                state: hint
              - value: bus
                type: sfsymbol
                state: hint
              - value: car.fill
                type: sfsymbol
                state: hint
              - value: airplane
                type: sfsymbol
                state: hint
        - instructions:
          - locale: fr_FR
            value: "Trie de votre véhicule préféré au moins aimé"
          - locale: en_US
            value: "Sort from your most favorite vehicle to your least favorite one"
          interface: dragAndDropOneToOne
          gameplay: openPlay
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: bicycle
                type: sfsymbol
              - value: airplane
                type: sfsymbol
              - value: bus
                type: sfsymbol
              - value: scooter
                type: sfsymbol
              - value: sailboat.fill
                type: sfsymbol
              - value: car.fill
                type: sfsymbol
        - instructions:
          - locale: fr_FR
            value: "Place les sf symbols dans l'ordre présentées sur l'image"
          - locale: en_US
            value: "Put the sf symbols you see in the image in the right order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          action:
            type: ipad
            value:
              type: image
              value: pictograms-landscapes_rain
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: cloud.rain
                type: sfsymbol
              - value: tree.fill
                type: sfsymbol

        - instructions:
          - locale: fr_FR
            value: "Place les symboles dans l'ordre présentées sur l'image"
          - locale: en_US
            value: "Put the symbols you see in the image in the right order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          action:
            type: ipad
            value:
              type: image
              value: thermometer.variable.and.figure
          payload:
            choices:
              - value: thermometer.medium
                type: sfsymbol
                state: hint
              - value: figure.stand
                type: sfsymbol

        - instructions:
          - locale: fr_FR
            value: "Écoutez et retrouvez l'ordre"
          - locale: en_US
            value: "Listen  and find the right order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          action:
            type: ipad
            value:
              type: speech
              value:
                - locale: fr_FR
                  utterance: "Soleil, Lune, Nuage, Pluie, Éclair, Vent"
                - locale: en_US
                  utterance: "Sun, Moon, Cloud, Rain, Bolt, Wind"
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: sun.max
                type: sfsymbol
                state: hint
              - value: moon.fill
                type: sfsymbol
                state: hint
              - value: cloud.fill
                type: sfsymbol
                state: hint
              - value: cloud.rain.fill
                type: sfsymbol
                state: hint
              - value: cloud.bolt.fill
                type: sfsymbol
                state: hint
              - value: wind
                type: sfsymbol
                state: hint
