name: DnDOneToOne_Color
exercises_payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false
  exercise_groups:
    - group:
        - instructions:
          - locale: fr_FR
            value: "Place la couleur dans la case en dessous"
          - locale: en_US
            value: "Put the color in the case below"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: yellow
                type: color
        - instructions:
          - locale: fr_FR
            value: "Retrouve l'ordre des couleurs du drapeau français"
          - locale: en_US
            value: "Find the order of the French flag colors"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: blue
                type: color
              - value: white
                type: color
              - value: red
                type: color
        - instructions:
          - locale: fr_FR
            value: "Trie de votre couleur préférée à la moins aimée"
          - locale: en_US
            value: "Sort from your most favorite color to your least favorite one"
          interface: dragAndDropOneToOne
          gameplay: openPlay
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: yellow
                type: color
              - value: red
                type: color
              - value: blue
                type: color
              - value: pink
                type: color
              - value: green
                type: color
              - value: orange
                type: color
        - instructions:
