payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false
  exercise_groups:
    - group:
        - instructions:
          - locale: fr_FR
            value: "Place la couleur dans la case en dessous"
          - locale: en_US
            value: "Put the color in the case below"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: yellow
                type: color
        - instructions:
          - locale: fr_FR
            value: "Retrouve l'ordre des couleurs du drapeau français"
          - locale: en_US
            value: "Find the order of the French flag colors"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: blue
                type: color
              - value: white
                type: color
              - value: red
                type: color
        - instructions:
          - locale: fr_FR
            value: "Trie de votre couleur préférée à la moins aimée"
          - locale: en_US
            value: "Sort from your most favorite color to your least favorite one"
          interface: dragAndDropOneToOne
          gameplay: openPlay
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: yellow
                type: color
              - value: red
                type: color
              - value: blue
                type: color
              - value: pink
                type: color
              - value: green
                type: color
              - value: orange
                type: color
        - instructions:
          - locale: fr_FR
            value: "Place les couleurs dans l'ordre présentées sur l'image"
          - locale: en_US
            value: "Put the color you see in the image in the right order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          action:
            type: ipad
            value:
              type: image
              value: pictograms-animals-farm-rooster_white-006B
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: red
                type: color
              - value: white
                type: color
              - value: green
                type: color

        - instructions:
          - locale: fr_FR
            value: "L'arc-en-ciel a mélangé ses couleurs, aide le à retrouver le bon ordre"
          - locale: en_US
            value: "The rainbow has its colors shuffled, help him sort it back"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          payload:
            choices:
              - value: red
                type: color
                state: answered
              - value: orange
                type: color
                state: unanswered
              - value: yellow
                type: color
                state: unanswered
              - value: green
                type: color
                state: unanswered
              - value: blue
                type: color
                state: unanswered
              - value: purple
                type: color
                state: answered

        - instructions:
          - locale: fr_FR
            value: "Place les couleurs dans l'ordre présentées sur l'image"
          - locale: en_US
            value: "Put the color you see in the image in the right order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          action:
            type: ipad
            value:
              type: image
              value: hands_on
          payload:
            choices:
              - value: blue
                type: color
                state: hint
              - value: pink
                type: color
              - value: red
                type: color
              - value: purple
                type: color
                state: hint
              - value: orange
                type: color

        - instructions:
          - locale: fr_FR
            value: "Écoutez et retrouvez l'ordre"
          - locale: en_US
            value: "Listen  and find the right order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          action:
            type: ipad
            value:
              type: speech
              value:
                - locale: fr_FR
                  utterance: "Bleu, Jaune, Rouge, Violet, Orange, Vert"
                - locale: en_US
                  utterance: "Blue, Yellow, Red, Purple, Orange, Green"
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: blue
                type: color
                state: hint
              - value: yellow
                type: color
                state: hint
              - value: red
                type: color
                state: hint
              - value: purple
                type: color
                state: hint
              - value: orange
                type: color
                state: hint
              - value: green
                type: color
                state: hint
