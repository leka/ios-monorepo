uuid: 1EA920DB6F664C5D8AAD1C0B12AF4DA3
name: DnDOneToOne_Emoji
exercises_payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false
  exercise_groups:
    - group:
        - instructions:
          - locale: fr_FR
            value: "Place l'emoji dans la case en dessous"
          - locale: en_US
            value: "Put the emoji in the case below"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: 🍎
                type: emoji
        - instructions:
          - locale: fr_FR
            value: "Retrouve l'ordre des couleurs du drapeau français"
          - locale: en_US
            value: "Find the order of the French flag colors"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: 🔵
                type: emoji
              - value: ⚪
                type: emoji
              - value: 🔴
                type: emoji
        - instructions:
          - locale: fr_FR
            value: "Trie de votre fruit préféré au moins aimé"
          - locale: en_US
            value: "Sort from your most favorite fruit to your least favorite one"
          interface: dragAndDropOneToOne
          gameplay: openPlay
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: 🍉
                type: emoji
              - value: 🍊
                type: emoji
              - value: 🍌
                type: emoji
              - value: 🍎
                type: emoji
              - value: 🍑
                type: emoji
              - value: 🍒
                type: emoji
        - instructions:
          - locale: fr_FR
            value: "Place les emojis dans l'ordre présentées sur l'image"
          - locale: en_US
            value: "Put the emojis you see in the image in the right order"
          interface: dragAndDropOneToOne
          gameplay: findTheRightOrder
          action:
            type: ipad
            value:
              type: image
              value: pictograms-landscapes_rain
          options:
            shuffle_choices: true
          payload:
            choices:
              - value: 🌧️
                type: emoji
              - value: 🌳
                type: emoji

        - instructions:
