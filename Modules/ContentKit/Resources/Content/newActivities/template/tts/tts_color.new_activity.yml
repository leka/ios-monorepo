payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false
  exercise_groups:
    # MARK: - TTS + findTheRightAnswers
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche la couleur rouge"
            - locale: en_US
              value: "Tap the red color"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: red
                type: color
                is_right_answer: true
        - instructions:
            - locale: fr_FR
              value: "Écoute puis touche la bonne couleur"
            - locale: en_US
              value: "Listen then touch the correct color"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          action:
            type: ipad
            value:
              type: speech
              value:
                - locale: fr_FR
                  utterance: "Jaune"
                - locale: en_US
                  utterance: "Yellow"
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: yellow
                type: color
                is_right_answer: true
              - value: green
                type: color
        - instructions:
            - locale: fr_FR
              value: "Quel est la couleur de l'objet ?"
            - locale: en_US
              value: "What's the object's color?"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          action:
            type: ipad
            value:
              type: image
              value: pictograms-foods-fruits-apple_red-0101
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: red
                type: color
                is_right_answer: true
              - value: blue
                type: color
              - value: green
                type: color
    # MARK: - TTS + findTheRightOrder
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche les couleurs du plus clair au plus foncé"
            - locale: en_US
              value: "Touch the colors from brightest to darkest"
          interface: touchToSelect
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: yellow
                type: color
              - value: orange
                type: color
              - value: red
                type: color
              - value: blue
                type: color
              - value: purple
                type: color
        - instructions:
            - locale: fr_FR
              value: "Touche les couleurs du plus clair au plus foncé"
            - locale: en_US
              value: "Touch the colors from brightest to darkest"
          interface: touchToSelect
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: yellow
                type: color
              - value: orange
                type: color
              - value: red
                type: color
              - value: blue
                type: color
              - value: purple
                type: color
              - value: black
                type: color

    # MARK: - TTS + associateCategories
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche les colors qui sont identiques"
            - locale: en_US
              value: "Tap the colors that are the same"
          interface: touchToSelect
          gameplay: associateCategories
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: red
                type: color
                category: catA
              - value: red
                type: color
                category: catA
              - value: yellow
                type: color
                category: catB
              - value: yellow
                type: color
                category: catB
              - value: yellow
                type: color
                category: catB
              - value: blue
                type: color
        - instructions:
            - locale: fr_FR
              value: "Touche les colors qui sont identiques"
            - locale: en_US
              value: "Tap the colors that are the same"
          interface: touchToSelect
          gameplay: associateCategories
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: purple
                type: color
                category: catA
              - value: purple
                type: color
                category: catA
              - value: orange
                type: color
                category: catB
              - value: orange
                type: color
                category: catB
              - value: purple
                type: color
                category: catA
              - value: orange
                type: color
                category: catB

    # MARK: - TTS + openPlay
    - group:
      - instructions:
        - locale: fr_FR
          value: "Choisis au moins 1 couleurs que tu aimes"
        - locale: en_US
          value: "Select at least 1 couleurs that you love"
        interface: touchToSelect
        gameplay: openPlay
        options:
          shuffle_choices: true
          validation:
            type: manual
            minimumToSelect: 1
        payload:
          choices:
            - value: blue
              type: color
            - value: green
              type: color
            - value: red
              type: color
            - value: purple
              type: color
            - value: pink
              type: color
            - value: yellow
              type: color
