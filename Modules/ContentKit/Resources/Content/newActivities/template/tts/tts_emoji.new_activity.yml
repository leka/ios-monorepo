payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false
  exercise_groups:
    # MARK: - TTS + findTheRightAnswers
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche les fruits 🍎"
            - locale: en_US
              value: "Tap the fruits 🍎"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: 🍎
                type: emoji
                is_right_answer: true
        - instructions:
            - locale: fr_FR
              value: "Écoute puis touche le bon fruit"
            - locale: en_US
              value: "Listen then touch the correct fruit"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          action:
            type: ipad
            value:
              type: speech
              value:
                - locale: fr_FR
                  utterance: "Pomme"
                - locale: en_US
                  utterance: "Apple"
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: 🍎
                type: emoji
                is_right_answer: true
              - value: 🍌
                type: emoji
        - instructions:
            - locale: fr_FR
              value: "Observe et trouve les bon fruits"
            - locale: en_US
              value: "Observe and find the correct fruits"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          action:
            type: ipad
            value:
              type: image
              value: pictograms-foods-fruits-apple_red-0101
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: 🍎
                type: emoji
                is_right_answer: true
              - value: 🍌
                type: emoji
              - value: 🍎
                type: emoji
                is_right_answer: true
    # MARK: - TTS + findTheRightOrder
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche les chiffres dans le bon ordre"
            - locale: en_US
              value: "Put the numbers in the right order"
          interface: touchToSelect
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: 1️⃣
                type: emoji
              - value: 2️⃣
                type: emoji
              - value: 3️⃣
                type: emoji
              - value: 4️⃣
                type: emoji
              - value: 5️⃣
                type: emoji
        - instructions:
            - locale: fr_FR
              value: "Touche les chiffres dans le bon ordre"
            - locale: en_US
              value: "Put the numbers in the right order"
          interface: touchToSelect
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: 1️⃣
                type: emoji
              - value: 2️⃣
                type: emoji
              - value: 3️⃣
                type: emoji
              - value: 4️⃣
                type: emoji
              - value: 5️⃣
                type: emoji
              - value: 6️⃣
                type: emoji

    # MARK: - TTS + associateCategories
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche les emojis qui sont identiques"
            - locale: en_US
              value: "Tap the emojis that are the same"
          interface: touchToSelect
          gameplay: associateCategories
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: 🎈
                type: emoji
                category: catA
              - value: 🎈
                type: emoji
                category: catA
              - value: 🎉
                type: emoji
                category: catB
              - value: 🎉
                type: emoji
                category: catB
              - value: 🎉
                type: emoji
                category: catB
              - value: 🦃
                type: emoji
        - instructions:
            - locale: fr_FR
              value: "Touche les emojis qui sont identiques 🎈🎈🎉🎉"
            - locale: en_US
              value: "Tap the emojis that are the same 🎈🎈🎉🎉"
          interface: touchToSelect
          gameplay: associateCategories
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: 🎈
                type: emoji
                category: catA
              - value: 🎈
                type: emoji
                category: catA
              - value: 🎉
                type: emoji
                category: catB
              - value: 🎉
                type: emoji
                category: catB
              - value: 🎈
                type: emoji
                category: catA
              - value: 🎉
                type: emoji
                category: catB

    # MARK: - TTS + openPlay
    - group:
      - instructions:
        - locale: fr_FR
          value: "Choisis au moins 2 animaux que tu aimes"
        - locale: en_US
          value: "Select at least 2 animals that you love"
        interface: touchToSelect
        gameplay: openPlay
        options:
          shuffle_choices: true
          validation:
            type: manual
            minimumToSelect: 2
        payload:
          choices:
            - value: 🐯
              type: emoji
            - value: 🐹
              type: emoji
            - value: 🐷
              type: emoji
            - value: 🐱
              type: emoji
            - value: 🐰
              type: emoji
            - value: 🐮
              type: emoji
