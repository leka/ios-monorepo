          interface: touchToSelect
          gameplay: associateCategories
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: airplane
                type: sfsymbol
                category: catA
              - value: airplane
                type: sfsymbol
                category: catA
              - value: ferry.fill
