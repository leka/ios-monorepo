    # MARK: - TTS + openPlay
    - group:
      - instructions:
        - locale: fr_FR
          value: "Choisis au moins 2 véhicules que tu aimes"
        - locale: en_US
          value: "Select at least 2 vehicles that you love"
        interface: touchToSelect
        gameplay: openPlay
