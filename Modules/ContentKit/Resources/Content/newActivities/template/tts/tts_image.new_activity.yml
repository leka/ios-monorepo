                category: catA
              - value: christmas_recognition_christmas_biscuit
                type: image
                category: catA
              - value: christmas_recognition_christmas_gift
                type: image
                category: catB
              - value: christmas_recognition_christmas_gift
                type: image
                category: catB
              - value: christmas_recognition_christmas_gift
                type: image
                category: catB
              - value: christmas_recognition_christmas_sock
                type: image
        - instructions:
            - locale: fr_FR
              value: "Touche les images qui sont identiques"
            - locale: en_US
              value: "Tap the images that are the same"
          interface: touchToSelect
          gameplay: associateCategories
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: christmas_recognition_christmas_biscuit
                type: image
                category: catA
              - value: christmas_recognition_christmas_biscuit
                type: image
                category: catA
              - value: christmas_recognition_christmas_gift
                type: image
                category: catB
              - value: christmas_recognition_christmas_gift
                type: image
                category: catB
              - value: christmas_recognition_christmas_biscuit
                type: image
                category: catA
              - value: christmas_recognition_christmas_gift
                type: image
                category: catB

    # MARK: - TTS + openPlay
    - group:
      - instructions:
        - locale: fr_FR
          value: "Choisis au moins 2 animaux que tu aimes"
        - locale: en_US
          value: "Select at least 2 animals that you love"
        interface: touchToSelect
        gameplay: openPlay
        options:
          shuffle_choices: true
          validation:
            type: manual
            minimumToSelect: 2
        payload:
          choices:
            - value: pictograms-animals-farm-cow_white-0070
              type: image
            - value: pictograms-animals-farm-horse_brown-006A
              type: image
            - value: pictograms-animals-farm-pig_pink-0073
              type: image
            - value: pictograms-animals-forest-bear_brown-005E
              type: image
            - value: pictograms-animals-insects-butterfly_blue-0095
              type: image
            - value: pictograms-animals-forest-wolf_gray-005F
              type: image
      - instructions:
        - locale: fr_FR
          value: "Quelle est ton émotion dans ce contexte ?"
        - locale: en_US
          value: "What's your emotion in this context? "
        interface: touchToSelect
        gameplay: openPlay
        action:
          type: ipad
          value:
            type: image
            value: context_hugo_swimming_pool_1
        options:
          shuffle_choices: true
          validation:
            type: manual
            minimumToSelect: 1
            maximumToSelect: 1
        payload:
