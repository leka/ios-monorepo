payload:
  options:
    shuffle_exercises: false
    shuffle_groups: false
  exercise_groups:
    # MARK: - TTS + findTheRightAnswers
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche la pomme"
            - locale: en_US
              value: "Tap the apple"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: pictograms-foods-fruits-apple_red-0101
                type: image
                is_right_answer: true
        - instructions:
            - locale: fr_FR
              value: "Écoute puis touche le bon fruit"
            - locale: en_US
              value: "Listen then touch the correct fruit"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          action:
            type: ipad
            value:
              type: speech
              value:
                - locale: fr_FR
                  utterance: "Pomme"
                - locale: en_US
                  utterance: "Apple"
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: pictograms-foods-fruits-apple_red-0101
                type: image
                is_right_answer: true
              - value: pictograms-foods-fruits-orange_orange-0105
                type: image
        - instructions:
            - locale: fr_FR
              value: "Observe et trouve les bon fruits"
            - locale: en_US
              value: "Observe and find the correct fruits"
          interface: touchToSelect
          gameplay: findTheRightAnswers
          action:
            type: ipad
            value:
              type: image
              value: pictograms-foods-fruits-apple_red-0101
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: pictograms-foods-fruits-apple_green-0100
                type: image
                is_right_answer: true
              - value: pictograms-foods-fruits-cherry_red-00FF
                type: image
              - value: pictograms-foods-fruits-apple_red-0101
                type: image
                is_right_answer: true
    # MARK: - TTS + findTheRightOrder
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche les animaux du plus petit au plus grand"
            - locale: en_US
              value: "Touch animals from smallest to tallest"
          interface: touchToSelect
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: order_by_size_different_insects_ladybug
                type: image
              - value: order_by_size_different_animals_snail
                type: image
              - value: order_by_size_different_animals_squirrel
                type: image
              - value: order_by_size_different_animals_dog
                type: image
              - value: order_by_size_different_animals_cow
                type: image
        - instructions:
            - locale: fr_FR
              value: "Touche les chiffres dans le bon ordre"
            - locale: en_US
              value: "Put the numbers in the right order"
          interface: touchToSelect
          gameplay: findTheRightOrder
          options:
            shuffle_choices: true
            validation:
              type: manual
          payload:
            choices:
              - value: order_by_size_different_insects_ladybug
                type: image
              - value: order_by_size_different_animals_snail
                type: image
              - value: order_by_size_different_animals_squirrel
                type: image
              - value: order_by_size_different_animals_dog
                type: image
              - value: order_by_size_different_animals_cow
                type: image
              - value: order_by_size_different_animals_giraffe
                type: image

    # MARK: - TTS + associateCategories
    - group:
        - instructions:
            - locale: fr_FR
              value: "Touche les images qui sont identiques"
            - locale: en_US
              value: "Tap the images that are the same"
          interface: touchToSelect
          gameplay: associateCategories
          options:
            shuffle_choices: true
            validation:
              type: automatic
          payload:
            choices:
              - value: christmas_recognition_christmas_biscuit
